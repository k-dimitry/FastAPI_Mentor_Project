[project]
name = "fastapi-mentor-project"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi>=0.140.0",
    "gunicorn>=23.0.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "redis[hiredis]>=5.0.0",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.51.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
]


[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "fakeredis>=2.26.0",
    "genbadge[coverage]>=1.1.3",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
    "time-machine>=3.5.1",
]


[tool.ruff]
target-version = "py312"
line-length = 80
exclude = [
    "alembic",
]


[tool.ruff.lint]
# Enable Pyflakes (`F`), pycodestyle (`E`), and isort (`I`) rules
select = ["E", "F", "I"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
# Enable preview-style formatting
preview = true
quote-style = "single"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
