[project]
name = "fastapi-mentor-project"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi>=0.140.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.51.0",
    "bcrypt>=5.0.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
]


[dependency-groups]
dev = [
    "ruff>=0.15.22",
]


[tool.ruff]
target-version = "py312"
line-length = 80

[tool.ruff.lint]
# Enable Pyflakes (`F`), pycodestyle (`E`), and isort (`I`) rules
select = ["E", "F", "I"]
fixable = ["ALL"]
unfixable = []
ignore = ["F821"]

[tool.ruff.format]
# Enable preview-style formatting
preview = true
quote-style = "single"
indent-style = "space"
